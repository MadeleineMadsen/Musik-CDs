<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" type="module"></script>
    <title>Music CDs</title>
</head>

<body>
    <header>
        <h1>Music CDs</h1>
    </header>

    <main>
        <form id="frmMusic">
            <div>
                <label for="txtAuthor">Author</label>
                <input type="text" class="textInput" id="txtAuthor" required>
            </div>

            <div>
                <label for="txtTitle">Titel</label>
                <input type="text" class="textInput" id="txtTitle" required>
            </div>

            <div>
                <label for="txtYear">Year</label>
                <input type="text" id="txtYear" pattern="[0-9]{4}" required>
            </div>

            <div>
                <input type="submit" value="Add">
            </div>
        </form>

        <section id="table">
            <table>
            <!-- THead - Dette grupperer indhold i en html tabel (Specifikt i header) -->
            <thead>
                <!-- Tr  - Dette er en tabel row -->
                <tr>
                    <!-- Th - Dette er tabel headeren -->
                    <th>Author</th>
                    <th>Title</th>
                    <th>Year</th>
                    <th class="DeleteContainer">x</th>
                </tr>
            </thead>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 - Music CDs - Madeleine Madsen</p>
    </footer>
</body>

<template id="table-template">
    <table>
        <tbody>
                <!-- Td - Dette er tabellens data -->
                <td class="Author"></td>
                <td class="Title"></td>
                <td class="Year"></td>
                <td class="DeleteContainer"><button class="Delete">&times;</button></td>
        </tbody>
    </table>
</template>

</html>
